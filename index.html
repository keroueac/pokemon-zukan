<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ポケモン図鑑">
<title>ポケモン図鑑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #1d1d1f;
  }
  .gen-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .gen-scroll::-webkit-scrollbar { display: none; }
  .gen-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #d0d0d0;
    background: #fff;
    color: #1d1d1f;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .gen-btn.active {
    background: #1d1d1f;
    color: #fff;
    border-color: #1d1d1f;
    font-weight: 500;
  }
  .toolbar {
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .tool-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    background: #fff;
    color: #1d1d1f;
    cursor: pointer;
    font-size: 13px;
    -webkit-tap-highlight-color: transparent;
  }
  .tool-btn:active { background: #f0f0f0; }
  .status {
    font-size: 13px;
    color: #666;
    margin-left: auto;
  }
  .progress-outer {
    height: 3px;
    background: #e0e0e0;
    border-radius: 99px;
    overflow: hidden;
    margin: 0 16px 4px;
  }
  .progress-inner {
    height: 100%;
    background: #1d1d1f;
    border-radius: 99px;
    transition: width 0.3s;
    width: 0%;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    padding: 12px 12px 32px;
  }
  .card-wrap {
    perspective: 600px;
    height: 190px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 8px;
  }
  .card-back { transform: rotateY(180deg); padding: 10px 8px; }
  .poke-img { width: 90px; height: 90px; image-rendering: auto; }
  .poke-img-back { width: 72px; height: 72px; image-rendering: auto; }
  .hint { font-size: 10px; color: #aaa; margin-top: 4px; }
  .poke-no { font-size: 10px; color: #aaa; }
  .poke-name { font-size: 15px; font-weight: 600; text-align: center; color: #1d1d1f; }
  .type-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px; }
  .type-badge {
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 500;
  }
  .loading {
    text-align: center;
    padding: 40px 16px;
    color: #888;
    font-size: 14px;
  }
  .empty {
    text-align: center;
    padding: 60px 16px;
    color: #aaa;
    font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <h1>ポケモン図鑑</h1>
  <div class="gen-scroll" id="gen-selector"></div>
</header>

<div id="toolbar-area" style="display:none">
  <div class="progress-outer"><div class="progress-inner" id="progress-bar"></div></div>
  <div class="toolbar">
    <button class="tool-btn" onclick="revealAll()">すべて開く</button>
    <button class="tool-btn" onclick="closeAll()">すべて閉じる</button>
    <button class="tool-btn" onclick="shuffleCurrent()">シャッフル</button>
    <span class="status" id="status-label"></span>
  </div>
</div>

<div id="loading-area" class="loading" style="display:none">
  読み込み中... <span id="load-progress"></span>
</div>

<div id="empty-area" class="empty">世代を選んでください</div>

<div class="grid" id="grid"></div>

function getJP(name) {
  if (JP[name]) return JP[name];
  const clean = name.replace(/-/g,'');
  if (JP[clean]) return JP[clean];
  const base = name.split('-')[0];
  if (JP[base]) return JP[base];
  return null;
}

let currentGen = null;
let pokeData = [];
let flippedSet = new Set();
let loadingAbort = false;

function buildGenSelector() {
  const sel = document.getElementById('gen-selector');
  GENERATIONS.forEach((g, i) => {
    const btn = document.createElement('button');
    btn.className = 'gen-btn';
    btn.id = 'gbtn-' + i;
    btn.textContent = g.label;
    btn.onclick = () => selectGen(i);
    sel.appendChild(btn);
  });
}

async function selectGen(idx) {
  if (currentGen === idx) return;
  loadingAbort = true;
  await new Promise(r => setTimeout(r, 50));
  loadingAbort = false;
  currentGen = idx;

  document.querySelectorAll('.gen-btn').forEach((b, i) => b.classList.toggle('active', i === idx));

  const gen = GENERATIONS[idx];
  pokeData = [];
  flippedSet = new Set();

  document.getElementById('grid').innerHTML = '';
  document.getElementById('empty-area').style.display = 'none';
  document.getElementById('loading-area').style.display = 'block';
  document.getElementById('toolbar-area').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';

  const total = gen.end - gen.start + 1;
  let loaded = 0;

  const BATCH = 10;
  for (let i = gen.start; i <= gen.end; i += BATCH) {
    if (loadingAbort) return;
    const batch = [];
    for (let j = i; j < Math.min(i + BATCH, gen.end + 1); j++) {
      batch.push(fetch('https://pokeapi.co/api/v2/pokemon/' + j).then(r => r.json()).catch(() => null));
    }
    const results = await Promise.all(batch);
    for (const data of results) {
      if (!data) continue;
      const jpName = getJP(data.name);
      const poke = {
        id: data.id,
        name: data.name,
        nameJP: jpName || data.name,
        sprite: (data.sprites.other && data.sprites.other['official-artwork'] && data.sprites.other['official-artwork'].front_default) || data.sprites.front_default,
        types: data.types.map(t => t.type.name),
      };
      pokeData.push(poke);
      loaded++;
      document.getElementById('load-progress').textContent = loaded + ' / ' + total;
      document.getElementById('progress-bar').style.width = Math.round(loaded / total * 100) + '%';
      appendCard(poke, pokeData.length - 1);
    }
  }

  document.getElementById('loading-area').style.display = 'none';
  document.getElementById('toolbar-area').style.display = 'block';
  updateStatus();
}

function appendCard(poke, idx) {
  const grid = document.getElementById('grid');
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.onclick = () => toggleCard(idx);

  const typeBadges = poke.types.map(t => {
    const c = TYPE_COLORS[t] || {bg:'#888',text:'#fff'};
    const jp = TYPE_JP[t] || t;
    return '<span class="type-badge" style="background:' + c.bg + ';color:' + c.text + '">' + jp + '</span>';
  }).join('');

  wrap.innerHTML =
    '<div class="card-inner" id="ci-' + idx + '">' +
      '<div class="card-face">' +
        '<img class="poke-img" src="' + poke.sprite + '" alt="ポケモン" loading="lazy">' +
        '<div class="hint">タップして確認</div>' +
      '</div>' +
      '<div class="card-face card-back">' +
        '<div class="poke-no">No.' + String(poke.id).padStart(3,'0') + '</div>' +
        '<img class="poke-img-back" src="' + poke.sprite + '" alt="' + poke.nameJP + '" loading="lazy">' +
        '<div class="poke-name">' + poke.nameJP + '</div>' +
        '<div class="type-row">' + typeBadges + '</div>' +
      '</div>' +
    '</div>';
  grid.appendChild(wrap);
}

function toggleCard(idx) {
  const el = document.getElementById('ci-' + idx);
  if (!el) return;
  if (flippedSet.has(idx)) { flippedSet.delete(idx); el.classList.remove('flipped'); }
  else { flippedSet.add(idx); el.classList.add('flipped'); }
  updateStatus();
}

function revealAll() {
  pokeData.forEach((_, i) => { flippedSet.add(i); const el = document.getElementById('ci-' + i); if (el) el.classList.add('flipped'); });
  updateStatus();
}

function closeAll() {
  flippedSet.clear();
  pokeData.forEach((_, i) => { const el = document.getElementById('ci-' + i); if (el) el.classList.remove('flipped'); });
  updateStatus();
}

function shuffleCurrent() {
  const grid = document.getElementById('grid');
  const cards = Array.from(grid.children);
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    grid.appendChild(cards[j]);
    cards.splice(j, 1);
  }
}

function updateStatus() {
  const total = pokeData.length;
  const opened = flippedSet.size;
  document.getElementById('status-label').textContent = '確認済み ' + opened + ' / ' + total;
  document.getElementById('progress-bar').style.width = Math.round(opened / total * 100) + '%';
}

buildGenSelector();
</script>
